<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tusen takk — Silje & Kjeld</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #B08D57;
      --gold-light: #D4B896;
      --deep: #2C2420;
      --stone-light: #8C8480;
      --ivory-dark: #F7F4F0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--ivory-dark);
      color: var(--deep);
      padding: 2rem;
      font-family: 'Cormorant Garamond', serif;
    }

    .wrap {
      max-width: 720px;
      background: #fff;
      border: 1px solid var(--gold-light);
      padding: 4rem 2rem;
      animation: fadeUp 0.9s ease both;
    }

    .logo {
      font-size: 3rem;
      font-style: italic;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .ornament {
      color: var(--gold);
      letter-spacing: 0.3em;
      margin: 1rem 0;
    }

    h1 {
      font-size: clamp(2.8rem, 10vw, 5rem);
      font-weight: 300;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--stone-light);
      max-width: 540px;
      margin: 0 auto;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 1rem 2rem;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    a:hover {
      background: var(--gold);
      color: #fff;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="logo">S & K</div>
    <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>

    <h1>Tusen takk</h1>

    <p>
      Svaret deres er registrert.
      Vi gleder oss til å dele mer informasjon om Bulgaria 2027 etter hvert som dato, sted og program blir klart.
    </p>

    <a href="/">Tilbake til siden</a>
  </div>
</body>
</html>
